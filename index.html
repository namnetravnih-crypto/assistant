    <!-- Оставляем всю вашу HTML разметку и CSS без изменений, меняем ТОЛЬКО скрипт ниже -->
    <script>
        // 1. Инициализация всех элементов интерфейса
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const canvasContainer = document.getElementById('canvasContainer');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const brushCursor = document.getElementById('brushCursor');
        
        const paramBrightness = document.getElementById('paramBrightness');
        const paramChroma = document.getElementById('paramChroma');
        const paramShadows = document.getElementById('paramShadows');
        const paramSmoothing = document.getElementById('paramSmoothing');
        const removeTextCheck = document.getElementById('removeTextCheck');
        const agingCheck = document.getElementById('agingCheck');
        const brushSizeInput = document.getElementById('brushSize');
        
        const btnMagicCursor = document.getElementById('btnMagicCursor');
        const btnEraser = document.getElementById('btnEraser');
        const btnUndo = document.getElementById('btnUndo');
        const btnMakeRound = document.getElementById('btnMakeRound');
        const btnDownload = document.getElementById('btnDownload');
        const detectedColorText = document.getElementById('detectedColorText');
        const customColorPicker = document.getElementById('customColorPicker');

        // Глобальное состояние
        let originalImage = null;
        let userDrawCanvas = document.createElement('canvas'); // Холст для масок
        let userDrawCtx = userDrawCanvas.getContext('2d');
        let historyStack = [];
        let currentTool = null;
        let isDrawing = false;
        let stampTargetColor = { r: 0, g: 32, b: 160 };
        let selectedColorMode = 'original';

        // 2. Глобальное предотвращение открытия файлов браузером (Решение проблемы Drag & Drop)
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => e.preventDefault());

        // Обработка зоны сброса
        dropZone.addEventListener('dragenter', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer && e.dataTransfer.files.length) {
                processImageFile(e.dataTransfer.files[0]); // Берём первый файл из сброшенных
            }
        });

        // Исправление триггера клика: передаем конкретный файл, а не объект события!
        fileInput.addEventListener('change', e => {
            if (e.target.files && e.target.files.length) {
                processImageFile(e.target.files[0]);
            }
        });

        // Сброс значения инпута при клике, чтобы можно было загружать один и тот же файл по кругу
        fileInput.addEventListener('click', () => {
            fileInput.value = null;
        });

        // 3. Главная функция инициализации изображения
        function processImageFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Пожалуйста, выберите файл изображения (PNG или JPG)!');
                return;
            }

            const imgURL = URL.createObjectURL(file);
            originalImage = new Image();
            
            originalImage.onload = function() {
                // Синхронизируем размеры холстов
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;
                userDrawCanvas.width = originalImage.width;
                userDrawCanvas.height = originalImage.height;
                
                // Заполняем слой ручной прорисовки нейтральным белым цветом
                userDrawCtx.fillStyle = '#ffffff';
                userDrawCtx.fillRect(0, 0, canvas.width, canvas.height);

                // Отрисовываем старт
                ctx.drawImage(originalImage, 0, 0);
                
                detectStampColor();
                updateProcessing();
                
                // Очищаем старую историю и создаем точку сохранения
                historyStack = [];
                saveHistory();
                
                // Переключаем экраны интерфейса
                dropZone.style.display = 'none';
                canvasContainer.style.display = 'block';
                
                document.getElementById('statusText').innerText = `Файл успешно загружен: ${file.name}`;
                document.getElementById('infoText').innerText = `${originalImage.width}x${originalImage.height} px`;
                
                URL.revokeObjectURL(imgURL);
            };
            originalImage.src = imgURL;
        }

        // 4. Умный анализ цвета
        function detectStampColor() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            let rSum = 0, gSum = 0, bSum = 0, count = 0;
            let types = { blue: 0, red: 0, violet: 0 };

            for (let i = 0; i < data.length; i += 16) {
                let r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a < 200 || (r > 220 && g > 220 && b > 220)) continue;

                if (b > r + 25 && b > g + 15) { types.blue++; rSum += r; gSum += g; bSum += b; count++; }
                else if (r > b + 25 && r > g + 25) { types.red++; rSum += r; gSum += g; bSum += b; count++; }
                else if (Math.abs(r - b) < 40 && r > g + 25) { types.violet++; rSum += r; gSum += g; bSum += b; count++; }
            }

            if (count > 0) {
                stampTargetColor = { r: Math.round(rSum/count), g: Math.round(gSum/count), b: Math.round(bSum/count) };
                let max = Object.keys(types).reduce((a, b) => types[a] > types[b] ? a : b);
                let labels = { blue: 'Синий', red: 'Красный', violet: 'Фиолетовый' };
                detectedColorText.innerText = `Определенный цвет: ${labels[max]} [RGB: ${stampTargetColor.r},${stampTargetColor.g},${stampTargetColor.b}]`;
            } else {
                stampTargetColor = { r: 20, g: 50, b: 160 };
                detectedColorText.innerText = `Цвет по умолчанию: Синий`;
            }
        }

        // 5. Основной конвейер пиксельной фильтрации
        function updateProcessing() {
            if (!originalImage) return;
            
            ctx.drawImage(originalImage, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            
            const maskData = userDrawCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            
            const thresh = parseInt(paramBrightness.value);
            const chroma = parseInt(paramChroma.value);
            const shadows = parseInt(paramShadows.value);
            const removeText = removeTextCheck.checked;
            
            let targetRGB = selectedColorMode !== 'original' ? hexToRgb(selectedColorMode) : null;

            for (let i = 0; i < data.length; i += 4) {
                // Проверка ручного стирания (Ластик красит в буфер черный цвет #000)
                if (maskData[i] === 0 && maskData[i+1] === 0 && maskData[i+2] === 0) {
                    data[i+3] = 0;
                    continue;
                }
                // Проверка ручного восстановления (Маска красит в буфер зеленый цвет #00ff00)
                if (maskData[i] === 0 && maskData[i+1] === 255 && maskData[i+2] === 0) {
                    continue; 
                }

                let r = data[i], g = data[i+1], b = data[i+2];
                let brightness = (r + g + b) / 3;

                if (brightness >= thresh) { data[i+3] = 0; continue; }
                if (r < shadows && g < shadows && b < shadows && !removeText) { data[i+3] = 0; continue; }

                if (removeText) {
                    let dist = Math.sqrt(Math.pow(r - stampTargetColor.r, 2) + Math.pow(g - stampTargetColor.g, 2) + Math.pow(b - stampTargetColor.b, 2));
                    if (dist > chroma * 2.0 && (r < 120 && g < 120 && b < 120)) {
                        data[i+3] = 0;
                        continue;
                    }
                }

                if (targetRGB && data[i+3] > 0) {
                    data[i] = targetRGB.r; data[i+1] = targetRGB.g; data[i+2] = targetRGB.b;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            let smooth = parseInt(paramSmoothing.value);
            if (smooth > 0) {
                ctx.globalCompositeOperation = 'source-atop';
                ctx.filter = `blur(${smooth * 0.3}px)`;
                ctx.drawImage(canvas, 0, 0);
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'source-over';
            }

            if (agingCheck.checked) {
                let currentData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let d = currentData.data;
                for (let i = 0; i < d.length; i += 4) {
                    if (d[i+3] > 0 && Math.random() < 0.15) {
                        d[i+3] = Math.max(0, d[i+3] - Math.floor(Math.random() * 210));
                    }
                }
                ctx.putImageData(currentData, 0, 0);
            }
        }

        // Слушатели интерфейса
        [paramBrightness, paramChroma, paramShadows, paramSmoothing].forEach(el => {
