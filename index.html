<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stamp Studio Pro — Инструмент для очистки оттисков</title>
    <style>
        :root {
            --bg-color: #1a1d24;
            --panel-bg: #242933;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        header {
            background-color: var(--panel-bg);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge {
            font-size: 0.75rem;
            background: #3b82f6;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Боковая панель управления */
        .sidebar {
            width: 340px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .control-group {
            background: rgba(0,0,0,0.15);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
            margin-top: 5px;
        }

        .range-val {
            font-size: 0.85rem;
            color: var(--accent-hover);
            font-weight: bold;
        }

        button {
            width: 100%;
            background-color: #374151;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover:not(:disabled) {
            background-color: #4b5563;
        }

        button.primary {
            background-color: var(--accent-color);
        }

        button.primary:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        button.active {
            background-color: #ef4444 !important;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Рабочая зона */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
            background-image: radial-gradient(var(--border-color) 1px, transparent 0);
            background-size: 24px 24px;
            z-index: 5;
        }

        /* Зона загрузки на весь экран */
        .dropzone {
            width: 100%;
            max-width: 600px;
            height: 350px;
            border: 2px dashed #4b5563;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(36, 41, 51, 0.6);
            backdrop-filter: blur(4px);
            text-align: center;
            padding: 20px;
        }

        .dropzone.dragover {
            border-color: var(--accent-color);
            background: rgba(79, 70, 229, 0.15);
            transform: scale(1.02);
        }

        .dropzone svg {
            width: 64px;
            height: 64px;
            fill: var(--text-muted);
            margin-bottom: 15px;
            pointer-events: none;
        }

        .dropzone p, .dropzone span {
            pointer-events: none;
        }

        .dropzone p {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .dropzone span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        #fileInput {
            display: none;
        }

        /* Контейнер для холста */
        .canvas-container {
            position: relative;
            display: none;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background-image: linear-gradient(45deg, #2b323c 25%, transparent 25%), 
                              linear-gradient(-45deg, #2b323c 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #2b323c 75%), 
                              linear-gradient(-45deg, transparent 75%, #2b323c 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 1px solid var(--border-color);
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
        }

        /* Круглый курсор ластика */
        #customCursor {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(239, 68, 68, 0.8);
            background: rgba(239, 68, 68, 0.15);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
    </style>
</head>
<body>

    <header>
        <h1>STAMP STUDIO <span style="color:var(--text-muted)">// PRO</span></h1>
        <div class="badge">Реквизит и Иллюстрации</div>
    </header>

    <div class="main-container">
        <!-- Панель управления -->
        <div class="sidebar">
            <div>
                <div class="section-title">Основная очистка</div>
                <div class="control-group" style="display: grid; gap: 10px;">
                    <button id="btnRemoveText" class="primary" disabled>Удалить посторонний текст</button>
                    <button id="btnMakeCircle" disabled>Коррекция в ровный круг</button>
                </div>
            </div>

            <div>
                <div class="section-title">Точные настройки фона</div>
                <div class="control-group">
                    <div class="flex-row">
                        <label for="rangeTolerance">Чувствительность удаления</label>
                        <span class="range-val" id="valTolerance">30</span>
                    </div>
                    <input type="range" id="rangeTolerance" min="5" max="150" value="30" disabled>
                    
                    <div class="flex-row" style="margin-top: 15px;">
                        <label for="rangeSmoothness">Сглаживание краев</label>
                        <span class="range-val" id="valSmoothness">1</span>
                    </div>
                    <input type="range" id="rangeSmoothness" min="0" max="5" value="1" disabled>
                </div>
            </div>

            <div>
                <div class="section-title">Ручные инструменты</div>
                <div class="control-group" style="display: grid; gap: 10px;">
                    <div class="flex-row">
                        <label for="rangeEraser">Размер ластика (px)</label>
                        <span class="range-val" id="valEraser">30</span>
                    </div>
                    <input type="range" id="rangeEraser" min="5" max="150" value="30" disabled>
                    
                    <div style="display: flex; gap: 8px;">
                        <button id="btnEraserMode" disabled>Включить ластик</button>
                        <button id="btnUndo" style="width: 70px;" title="Отмена действия" disabled>↩</button>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">Стилизация</div>
                <div class="control-group">
                    <div class="flex-row">
                        <label for="rangeAging">Интенсивность состаривания</label>
                        <span class="range-val" id="valAging">40%</span>
                    </div>
                    <input type="range" id="rangeAging" min="10" max="90" value="40" disabled>
